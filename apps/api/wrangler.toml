name = "stillscans-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

routes = [{ pattern = "api.usestillscans.com", custom_domain = true }]

[vars]
ENVIRONMENT = "production"
WEB_ORIGIN = "https://usestillscans.com"
API_ORIGIN = "https://api.usestillscans.com"
COOKIE_DOMAIN = ".usestillscans.com"

[observability]
enabled = true

# Retry unsynced KV writes and purge expired data.
[triggers]
crons = ["*/5 * * * *"]

# Replace the ids after creating the resources (see docs/DEPLOY.md).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "70a08af8c6844c128d2839948ddd5e22"

# Same namespace as redirect.
[[kv_namespaces]]
binding = "KV"
id = "977aed734504486998a3607ef01906d6"

[[queues.consumers]]
queue = "stillscans-scans"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "stillscans-scans-dlq"

[[ratelimits]]
name = "CHECK_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[env.staging]
name = "stillscans-api-staging"
routes = []
workers_dev = true

[env.staging.vars]
ENVIRONMENT = "staging"
WEB_ORIGIN = "https://staging.usestillscans.com"
API_ORIGIN = "REPLACE_WITH_STAGING_API_ORIGIN"
COOKIE_DOMAIN = ".usestillscans.com"

[env.staging.triggers]
crons = ["*/5 * * * *"]

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_STAGING_HYPERDRIVE_ID"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_STAGING_KV_ID"

[[env.staging.queues.consumers]]
queue = "stillscans-scans-staging"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "stillscans-scans-staging-dlq"

[[env.staging.ratelimits]]
name = "CHECK_LIMITER"
namespace_id = "2001"
simple = { limit = 30, period = 60 }

[[env.staging.ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "2002"
simple = { limit = 5, period = 60 }

